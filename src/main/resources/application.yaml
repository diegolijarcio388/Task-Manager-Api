spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_manager}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}

    show-sql: ${DB_SHOW_SQL:true}

    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}